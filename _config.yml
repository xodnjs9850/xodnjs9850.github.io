title: OpenClaw 메일 비서 강의
description: 비전공자를 위한 OpenClaw 생태계 소개 + 실용 데모 (4일 × 4시간)
url: "https://xodnjs9850.github.io"

# just-the-docs 테마 (원격 테마 사용)
remote_theme: just-the-docs/just-the-docs

plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag

# 검색
search_enabled: true
search:
  heading_level: 2
  previews: 2

heading_anchors: true
color_scheme: light

# 상단 우측 보조 링크
aux_links:
  "GitHub":
    - "https://github.com/xodnjs9850/xodnjs9850.github.io"

# 마크다운 렌더러
markdown: kramdown
kramdown:
  syntax_highlighter: rouge
  input: GFM
  hard_wrap: false

# 빌드 제외
exclude:
  - vendor/
  - Gemfile
  - Gemfile.lock
  - README.md
  - .gitignore
